function editWord(x){let zh=prompt('中文詞義',x.zh);if(zh===null)return;let en=prompt('英文',x.en);if(en===null)return;let ipa=prompt('IPA 音標',phonetic(x));if(ipa===null)return;if(!zh.trim()||!en.trim())return alert('不可空白');if(all().some(y=>y.id!==x.id&&y.en.toLowerCase()===en.trim().toLowerCase()))return alert('英文重複');state.edits[x.id]={zh:zh.trim(),en:en.trim(),ipa:ipa.trim()};save();render()}function stop(){token++;drilling=false;$('drillControls').hidden=true;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent='已停止'}function speak(text,lang,t){return new Promise((resolve,reject)=>{if(!text||t!==token)return resolve();if(!window.speechSynthesis)return reject(Error('此瀏覽器不支援朗讀'));let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=Number($('rate').value);u.onend=resolve;u.onerror=e=>reject(Error(e.error));speechSynthesis.speak(u)})}async function play(items,n){showTab("audio");stop();let t=token;if(!items.length){$('status').textContent='沒有選取詞彙';return}try{do{for(let x of items){for(let i=0;i<n;i++){if(t!==token)return;$('now').textContent=x.zh||'未填中文';$('answer').textContent=answerText(x);$('status').textContent=`第 ${i+1}/${n} 次`;let m=$('mode').value,lang=$('accent').value;if(m==='ze')await speak(x.zh,'zh-TW',t);await speak(x.en,lang,t);if(m==='ez')await speak(x.zh,'zh-TW',t);await new Promise(r=>setTimeout(r,500))}}}while(t===token&&$('loop').checked);if(t===token)$('status').textContent='播放完成'}catch(e){if(t===token)$('status').textContent='朗讀中斷：'+e.message}}
$('add').onclick=()=>{let en=$('en').value.trim(),zh=$('zh').value.trim();if(!en||!zh)return alert('請輸入英文及中文意思');if(all().some(x=>x.en.toLowerCase()===en.toLowerCase()))return alert('已有相同英文');state.notes.push({id:'n:'+Date.now()+Math.random(),en,zh,ipa:$('ipa').value.trim()});save();$('en').value=$('zh').value=$('ipa').value='';showTab('notes')};$('translate').onclick=()=>window.open('https://translate.google.com/?sl=en&tl=zh-TW&text='+encodeURIComponent($('en').value)+'&op=translate','_blank','noopener');$('start').onclick=()=>{let s=$('source').value;play(all().filter(x=>s==='all'||s==='selected'&&state.selected.includes(x.id)||s==='weak'&&state.marks[x.id]==='weak'||s==='notes'&&x.id.startsWith('n:')),Number($('repeat').value))};$('stop').onclick=stop;function nextDrill(){current=queue.shift();$('answer').textContent='';$('now').textContent=current?(current.zh||'未填中文'):'本輪完成';$('drillControls').hidden=!current;$('status').textContent=`剩餘 ${queue.length} 詞`;$('known').disabled=$('weak').disabled=true}$('drill').onclick=()=>{stop();let a=all().filter(x=>state.marks[x.id]!=='known');for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}queue=a.slice(0,50);drilling=true;nextDrill()};$('reveal').onclick=()=>{if(current&&drilling){$('answer').textContent=answerText(current);$('known').disabled=$('weak').disabled=false;speak(current.en,$('accent').value,token).catch(()=>{})}};for(let m of ['known','weak'])$(m).onclick=()=>{if(drilling&&current&&!$('known').disabled){speechSynthesis.cancel();mark(current.id,m);nextDrill()}};$('search').oninput=$('filter').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('selectPage').onclick=()=>{state.selected=[...new Set([...state.selected,...filtered().slice(page*20,page*20+20).map(x=>x.id)])];save();render()};$('clear').onclick=()=>{state.selected=[];save();render()};$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({version:1,...state})],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='ghost-english-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('restore').onchange=async()=>{try{let s=JSON.parse(await $('restore').files[0].text());if(s.version!==1||!Array.isArray(s.notes)||!s.marks||!Array.isArray(s.selected))throw Error();let notes=s.notes.filter(x=>typeof x.id==='string'&&x.id.startsWith('n:')&&typeof x.en==='string'&&typeof x.zh==='string');state.notes=[...new Map([...notes,...state.notes].map(x=>[x.id,x])).values()];let ids=new Set(all().map(x=>x.id));for(let [id,m] of Object.entries(s.marks))if(ids.has(id)&&['known','weak'].includes(m)&&!state.marks[id])state.marks[id]=m;for(let [id,e] of Object.entries(s.edits||{}))if(ids.has(id)&&e&&typeof e.zh==="string"&&typeof e.en==="string"&&typeof e.ipa==="string"&&!state.edits[id])state.edits[id]={zh:e.zh,en:e.en,ipa:e.ipa};state.selected=[...new Set([...state.selected,...s.selected.filter(x=>ids.has(x))])];save();render()}catch(e){alert('備份格式不正確')} };function showTab(t){activeTab=t;let list=['notes','words','sentences','weak'].includes(t);for(let [id,visible] of Object.entries({home:t==='home',createPanel:t==='create',audioPanel:t==='audio'||t==='drill',listPanel:list,backupPanel:t==='backup'}))$(id).hidden=!visible;document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===t)));if(list){$('listTitle').textContent={notes:'我的筆記',words:'生活單字',sentences:'生活句子',weak:'不熟加強'}[t];$('filter').value='all';$('search').value='';page=0;}if(t==='audio'||t==='drill')$('audioTitle').textContent=t==='drill'?'🧠 每日死記':'🔁 多句洗腦';render();}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{showTab(b.dataset.tab);if(b.dataset.tab==='drill')$('drill').click()});showTab('home');
